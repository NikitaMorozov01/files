<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Страница не найдена • ГУАП • Отзывы</title>
<style>
:root { --bg: #0F0F10; --gold: #D4A53C; --text: #EDE9E0; --text-muted: #B9B4AA; }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  text-align: center;
}
.code { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(4rem, 18vw, 7rem); font-weight: 600; color: var(--gold); line-height: 1; }
p { color: var(--text-muted); margin: 12px 0 28px; }
a {
  display: inline-block;
  padding: 14px 28px;
  border-radius: 6px;
  background: var(--gold);
  color: #15120B;
  font-weight: 700;
  text-decoration: none;
}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <p>Такой страницы нет. Возможно, ссылка устарела.</p>
  <a href="/">На главную</a>
</main>
</body>
</html>
