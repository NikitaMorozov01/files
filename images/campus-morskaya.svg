<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Корпус ГУАП на Большой Морской улице">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B2F"/>
      <stop offset="1" stop-color="#3B3B6B"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8B2D1"/>
      <stop offset="1" stop-color="#6C7BA8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E7F5"/>
      <stop offset="1" stop-color="#8B97BC"/>
    </linearGradient>
  </defs>

  <!-- Небо -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Звёзды -->
  <g fill="#FFFFFF">
    <circle cx="75" cy="50" r="1.5" opacity="0.6"/>
    <circle cx="185" cy="90" r="1" opacity="0.4"/>
    <circle cx="305" cy="40" r="1.5" opacity="0.5"/>
    <circle cx="460" cy="70" r="1" opacity="0.4"/>
    <circle cx="575" cy="35" r="1.5" opacity="0.6"/>
    <circle cx="695" cy="80" r="1" opacity="0.4"/>
    <circle cx="125" cy="130" r="1" opacity="0.3"/>
    <circle cx="645" cy="120" r="1" opacity="0.3"/>
  </g>

  <!-- Земля -->
  <rect x="0" y="430" width="800" height="70" fill="#14142A"/>
  <rect x="0" y="430" width="800" height="3" fill="#F5C542" opacity="0.25"/>

  <!-- Здание -->
  <rect x="180" y="160" width="440" height="270" rx="2" fill="url(#wall)"/>

  <!-- Карниз -->
  <rect x="180" y="160" width="440" height="10" fill="#F5C542" opacity="0.8"/>

  <!-- Декоративный пояс -->
  <rect x="180" y="300" width="440" height="6" fill="#5A668F"/>

  <!-- Окна: 2 этажа -->
  <g fill="url(#glass)">
    <rect x="210" y="190" width="60" height="80" rx="3"/>
    <rect x="300" y="190" width="60" height="80" rx="3"/>
    <rect x="440" y="190" width="60" height="80" rx="3"/>
    <rect x="530" y="190" width="60" height="80" rx="3"/>

    <rect x="210" y="320" width="60" height="80" rx="3"/>
    <rect x="300" y="320" width="60" height="80" rx="3"/>
    <rect x="440" y="320" width="60" height="80" rx="3"/>
    <rect x="530" y="320" width="60" height="80" rx="3"/>
  </g>

  <!-- Вывеска ГУАП -->
  <rect x="360" y="330" width="80" height="24" rx="4" fill="#1B1B2F"/>
  <text x="400" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F5C542" letter-spacing="2">ГУАП</text>

  <!-- Арка входа -->
  <path d="M 370 430 L 370 360 A 30 30 0 0 1 430 360 L 430 430 Z" fill="#2A2A4A"/>
  <path d="M 378 430 L 378 362 A 22 22 0 0 1 422 362 L 422 430 Z" fill="url(#glass)"/>
  <path d="M 370 430 L 370 360 A 30 30 0 0 1 430 360 L 430 430 Z" fill="none" stroke="#F5C542" stroke-width="3"/>

  <!-- Фонари -->
  <g fill="#F5C542">
    <rect x="198" y="380" width="4" height="50"/>
    <circle cx="200" cy="376" r="6"/>
    <rect x="598" y="380" width="4" height="50"/>
    <circle cx="600" cy="376" r="6"/>
  </g>
</svg>