<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Корпус ГУАП на улице Ленсовета">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B2F"/>
      <stop offset="1" stop-color="#3B3B6B"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8B2D1"/>
      <stop offset="1" stop-color="#6C7BA8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E7F5"/>
      <stop offset="1" stop-color="#8B97BC"/>
    </linearGradient>
  </defs>

  <!-- Небо -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Звёзды -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="55" r="1.5" opacity="0.6"/>
    <circle cx="190" cy="95" r="1" opacity="0.4"/>
    <circle cx="310" cy="40" r="1.5" opacity="0.5"/>
    <circle cx="470" cy="75" r="1" opacity="0.4"/>
    <circle cx="580" cy="35" r="1.5" opacity="0.6"/>
    <circle cx="700" cy="85" r="1" opacity="0.4"/>
    <circle cx="130" cy="135" r="1" opacity="0.3"/>
    <circle cx="650" cy="125" r="1" opacity="0.3"/>
  </g>

  <!-- Земля -->
  <rect x="0" y="430" width="800" height="70" fill="#14142A"/>
  <rect x="0" y="430" width="800" height="3" fill="#F5C542" opacity="0.25"/>

  <!-- Здание: классический стиль -->
  <rect x="200" y="180" width="400" height="250" rx="2" fill="url(#wall)"/>

  <!-- Фронтон -->
  <polygon points="200,180 400,110 600,180" fill="#5A668F"/>
  <polygon points="200,180 400,110 600,180" fill="none" stroke="#F5C542" stroke-width="2"/>
  <circle cx="400" cy="150" r="10" fill="#F5C542"/>

  <!-- Карниз -->
  <rect x="200" y="180" width="400" height="8" fill="#F5C542" opacity="0.8"/>

  <!-- Колонны -->
  <g fill="#8B97BC">
    <rect x="220" y="200" width="18" height="230"/>
    <rect x="280" y="200" width="18" height="230"/>
    <rect x="340" y="200" width="18" height="230"/>
    <rect x="442" y="200" width="18" height="230"/>
    <rect x="502" y="200" width="18" height="230"/>
    <rect x="562" y="200" width="18" height="230"/>
  </g>

  <!-- Окна: верхний ряд -->
  <g fill="url(#glass)">
    <rect x="250" y="220" width="20" height="60" rx="2"/>
    <rect x="310" y="220" width="20" height="60" rx="2"/>
    <rect x="370" y="220" width="60" height="60" rx="2"/>
    <rect x="470" y="220" width="20" height="60" rx="2"/>
    <rect x="530" y="220" width="20" height="60" rx="2"/>
  </g>

  <!-- Окна: нижний ряд -->
  <g fill="url(#glass)">
    <rect x="250" y="300" width="20" height="60" rx="2"/>
    <rect x="310" y="300" width="20" height="60" rx="2"/>
    <rect x="370" y="300" width="60" height="60" rx="2"/>
    <rect x="470" y="300" width="20" height="60" rx="2"/>
    <rect x="530" y="300" width="20" height="60" rx="2"/>
  </g>

  <!-- Вывеска ГУАП -->
  <rect x="360" y="270" width="80" height="24" rx="4" fill="#1B1B2F"/>
  <text x="400" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F5C542" letter-spacing="2">ГУАП</text>

  <!-- Вход -->
  <rect x="370" y="380" width="60" height="50" fill="#2A2A4A"/>
  <rect x="378" y="388" width="44" height="42" fill="url(#glass)"/>
  <rect x="370" y="380" width="60" height="5" fill="#F5C542"/>

  <!-- Ступени -->
  <rect x="350" y="430" width="100" height="8" fill="#5A668F"/>
  <rect x="340" y="438" width="120" height="8" fill="#4A5578"/>
</svg>