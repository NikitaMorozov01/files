<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Корпус ГУАП на улице Гастелло">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B2F"/>
      <stop offset="1" stop-color="#3B3B6B"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8B2D1"/>
      <stop offset="1" stop-color="#6C7BA8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E7F5"/>
      <stop offset="1" stop-color="#8B97BC"/>
    </linearGradient>
  </defs>

  <!-- Небо -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Звёзды -->
  <g fill="#FFFFFF">
    <circle cx="90" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="200" cy="100" r="1" opacity="0.4"/>
    <circle cx="330" cy="45" r="1.5" opacity="0.5"/>
    <circle cx="480" cy="80" r="1" opacity="0.4"/>
    <circle cx="600" cy="40" r="1.5" opacity="0.6"/>
    <circle cx="710" cy="90" r="1" opacity="0.4"/>
    <circle cx="150" cy="140" r="1" opacity="0.3"/>
    <circle cx="660" cy="130" r="1" opacity="0.3"/>
  </g>

  <!-- Земля -->
  <rect x="0" y="430" width="800" height="70" fill="#14142A"/>
  <rect x="0" y="430" width="800" height="3" fill="#F5C542" opacity="0.25"/>

  <!-- Здание: компактное, 4 этажа -->
  <rect x="240" y="170" width="320" height="260" rx="4" fill="url(#wall)"/>

  <!-- Крыша -->
  <rect x="250" y="150" width="300" height="22" rx="3" fill="#5A668F"/>

  <!-- Тех-антенна с "схемой" -->
  <rect x="390" y="120" width="6" height="32" fill="#F5C542"/>
  <circle cx="393" cy="118" r="5" fill="#F5C542"/>
  <g stroke="#F5C542" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 393 118 L 393 100 L 420 100 L 420 90"/>
    <circle cx="420" cy="90" r="3" fill="#F5C542"/>
    <path d="M 393 118 L 393 100 L 360 100 L 360 90"/>
    <circle cx="360" cy="90" r="3" fill="#F5C542"/>
  </g>

  <!-- Окна (4 колонки x 3 ряда) -->
  <g fill="url(#glass)">
    <rect x="260" y="190" width="55" height="40" rx="2"/>
    <rect x="335" y="190" width="55" height="40" rx="2"/>
    <rect x="410" y="190" width="55" height="40" rx="2"/>
    <rect x="485" y="190" width="55" height="40" rx="2"/>

    <rect x="260" y="250" width="55" height="40" rx="2"/>
    <rect x="335" y="250" width="55" height="40" rx="2"/>
    <rect x="410" y="250" width="55" height="40" rx="2"/>
    <rect x="485" y="250" width="55" height="40" rx="2"/>

    <rect x="260" y="310" width="55" height="40" rx="2"/>
    <rect x="335" y="310" width="55" height="40" rx="2"/>
    <rect x="410" y="310" width="55" height="40" rx="2"/>
    <rect x="485" y="310" width="55" height="40" rx="2"/>
  </g>

  <!-- Вывеска ГУАП -->
  <rect x="330" y="330" width="140" height="24" rx="4" fill="#1B1B2F"/>
  <text x="400" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#F5C542" letter-spacing="3">ГУАП</text>

  <!-- Вход -->
  <rect x="350" y="360" width="100" height="70" fill="#2A2A4A"/>
  <rect x="358" y="368" width="36" height="62" fill="url(#glass)"/>
  <rect x="406" y="368" width="36" height="62" fill="url(#glass)"/>
  <rect x="350" y="360" width="100" height="6" fill="#F5C542"/>
</svg>